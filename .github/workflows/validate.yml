name: Validate Jekyll build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site (strict front matter)
        run: bundle exec jekyll build --strict_front_matter --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
